<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="wr.css">
        <link rel="stylesheet" href="levels.css">
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <title>Wiki Speedrun Game</title>
	</head>

	<body>

		<div id="result1"></div> <!-- Navbar -->

		<div class="wikirun_index">
			<h1> Wiki Speedrun level select: </h1>

			<a href="wikirun_gameplay.html?level=1" class="level">Level 1 <img src="Images/onestar.png" alt="star image" width="40" height="40"> </a>
		<a href="wikirun_gameplay.html?level=2" class="level">Level 2 <img src="Images/twostar.png" alt="two star image" width="80" height="40"> </a>
		<a href="wikirun_gameplay.html?level=3" class="level">Level 3 <img src="Images/threestar.png" alt="three star image" width="120" height="40"></a>
		<a href="wikirun_gameplay.html?level=4" class="level">Level 4 <img src="Images/fourstar.png" alt="four star image" width="160" height="40"></a>
		<a href="wikirun_gameplay.html?level=5" class="level">Level 5 <img src="Images/fivestar.png" alt="five star image" width="200" height="40"></a>
		</div>

	</body>
	
	<!-- Footer will be loaded here -->
	<div id="footer-placeholder"></div>

	<!-- jQuery loading for footer -->
	<script>
	  $(document).ready(function () {
		$("#footer-placeholder").load("footer.html .footer", function () {
		  // After footer is loaded, force layout recalculation if needed
		  document.body.style.display = "flex"; // Re-trigger flexbox
		});
	  });
  
	  // Navbar loader
	  $(function () {
		$("#result1").load("navbar.html", function (response, status, xhr) {
		  if (status === "error") {
			$("#result1").html("Error loading navbar: " + xhr.status + " " + xhr.statusText);
		  }
		});
	  });
	</script>

</html>
