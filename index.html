<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="wr.css" />
  <title>Wiki Speedrun - Home</title>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

</head>

<body>

  <!--the navbar is loaded using jQuery -->
  <script>
    $(function () {
      $("#result1").load("navbar.html", function (response, status, xhr) {
        if (status === "error") {
          $("#result1").html("Error loading navbar: " + xhr.status + " " + xhr.statusText);
          console.error("Navbar load failed:", xhr.status, xhr.statusText);
        }
      });
    });
  </script>


  <div id="result1"></div>


  <div class="title-container">
    <h1 class="animated-title">Wiki Speedrun Game</h1>
  </div>

  <div class="button-container">
    <button onclick="window.location.href='levels.html'">Start Game</button>
  </div>

  <!-- the footer is loadeed using jQuery-->
  <script>
    window.onload = function() {
      jQuery("#result2").load("footer.html", function(response, status, xhr) {
        if (status == "error") {
          jQuery("#result2").html("Error loading footer: " + xhr.status + " " + xhr.statusText);
        }
      });
    };
  </script>

  <div id="result2"></div>

</body>
</html>
