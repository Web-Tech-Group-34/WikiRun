<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="index.css" />
  <title>Wiki Speedrun - Home</title>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

</head>

<body>

  <script>
    window.onload = function() {
      jQuery("#result").load("navbar.html", function(response, status, xhr) {
        if (status == "error") {
          jQuery("#result").html("Error loading navbar: " + xhr.status + " " + xhr.statusText);
        }
      });
    };
  </script>


<div id="result"></div>


  <div class="title-container">
    <h1 class="animated-title">Wiki Speedrun Game</h1>
  </div>

  <div class="button-container">
    <button onclick="window.location.href='levels.html'">Start Game</button>
    <button onclick="window.location.href='levels.html'">Level Select</button>
  </div>

</body>
</html>
