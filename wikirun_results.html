<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="wr.css">
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <title>Wiki Speedrun Results</title>
	</head>

	<body>

		<div id="result1"></div> <!-- Navbar -->
		  
		<main class="pagewrapper-k">  
		<div class="results-container">
			<h1> Results </h1>

			<!--top row-->
			<div class="toprow-k">
				<div class="startpage-k">
					<span class="label-k">Start Page:</span> 
					<span class="value-k" id="startPage"></span>
				</div>
				<div class="endpage-k">
					<span class="label-k">End Page:</span>
					<span class="value-k" id="endPage"></span>
				</div>
			</div>

			<hr class="hr-k">

			<!--middle row-->
			<div class="middlerow-k">
				<div class="stats-k"><strong>Clicks Used:</strong> <span id="clicks"></span></div>
				<div class="stats-k"><strong>Time Taken:</strong> <span id="time"></span> seconds</div>
				<div class="stats-k"><strong>Difficulty:</strong> <span id="difficulty"></span></div>
			</div>

			<hr class="hr-k">

			<!--final score centred-->
			<div class="scores-k">
				<p><strong>Final Score:</strong> <span id="finalScore">Loading...</span></p>

			<!--star graphic to visual siplay score rating-->
			<div class="star-rating">
				<div class="star-background">★★★★★</div>
				<div class="star-foreground" id="starFill">★★★★★</div>
			  </div>
			</div>

			<hr class="hr-k">

			<!--bottom section-->
			<div class="paths-k">
			<p><strong>Optimal Path:</strong> <span id="optimalPath"></span></p>
			<p><strong>Your Path:</strong> <span id="userPath"></span></p>
			</div>

			<button onclick="window.location.href='wikirun_levels.html'">Play Again</button>
		</div>
		</main>
        
		<script src="results.js"></script>
	
	</body>
	
	<!-- Footer will be loaded here -->
	<div id="footer-placeholder"></div>

	<!-- jQuery loading for footer -->
	<script>
	  $(document).ready(function () {
		$("#footer-placeholder").load("footer.html .footer", function () {
		  // After footer is loaded, force layout recalculation if needed
		  document.body.style.display = "flex"; // Re-trigger flexbox
		});
	  });
  
	  // Navbar loader
	  $(function () {
		$("#result1").load("navbar.html", function (response, status, xhr) {
		  if (status === "error") {
			$("#result1").html("Error loading navbar: " + xhr.status + " " + xhr.statusText);
		  }
		});
	  });
	</script>

</html>
